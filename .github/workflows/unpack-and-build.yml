name: unpack-and-build
# Upload a whatsapp-classic-*.zip to the repo root; this extracts it and builds the APK.
on:
  push:
    paths: ["*.zip"]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - name: Extract newest zip into workspace
        run: |
          ZIP="$(ls ./*.zip | sort -V | tail -n1)"
          echo "Using $ZIP"
          unzip -oq "$ZIP" -x ".github/*"
          chmod +x scripts/build-rust.sh
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK + platform (runner already has the Android SDK)
        run: |
          SDKM="$(command -v sdkmanager || ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Build Rust engine + Kotlin bindings
        run: ./scripts/build-rust.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-classic-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: rust/Cargo.lock
